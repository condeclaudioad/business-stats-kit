<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas del presentador · Tu dashboard de negocio</title><link rel="stylesheet" href="assets/Hanken.css"><link rel="stylesheet" href="assets/Fraunces.css"><style>*{box-sizing:border-box}body{background:#eae6db;color:#211b60;font-family:'Hanken Grotesk',sans-serif;margin:0;padding:40px}header{display:flex;justify-content:space-between;border-bottom:1px solid #bcb6ca;padding-bottom:20px;font-size:17px}h1{font:700 46px/1.1 'Fraunces',serif;margin:35px 0 25px}#notes{font-size:25px;line-height:1.6;max-width:900px;color:#302d3b}#nextTitle{font-size:21px;border-top:1px solid #bcb6ca;margin-top:35px;padding-top:22px}nav{display:flex;gap:12px;align-items:center;margin-top:28px}button{font:inherit;font-size:18px;padding:13px 20px;border:1px solid #4a3af0;background:transparent;color:#4a3af0;cursor:pointer}button:hover{background:#d7d0fc}button:focus-visible{outline:3px solid #4a3af0;outline-offset:3px}#next{background:#4a3af0;color:#fff}.hint{font-size:15px;color:#686372;margin-top:30px}#build{font-size:17px;color:#686372}#timer{font-variant-numeric:tabular-nums}.timercontrol{border:0;padding:4px;font-size:14px}</style></head><body><header><span id="where">Notas del presentador</span><span><time id="timer">00:00</time> <button class="timercontrol" id="timerToggle">Iniciar</button><button class="timercontrol" id="timerReset">Reiniciar</button></span></header><h1 id="title">Conectando con la presentación…</h1><p id="build"></p><p id="notes">Abrí esta ventana desde el botón Notas de la presentación.</p><p id="nextTitle"></p><nav><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="blackout">Pantalla en negro</button></nav><p class="hint">Compartí solamente la ventana de la presentación. Estas notas son visibles si compartís toda tu pantalla.</p><script>
const $=id=>document.getElementById(id);function send(command){if(window.opener)window.opener.postMessage({type:'presenter-command',command},location.origin==='null'?'*':location.origin)};addEventListener('message',e=>{if(e.source!==window.opener||e.data?.type!=='deck-state')return;const d=e.data;$('title').textContent=d.title;$('where').textContent=`${d.index+1} / ${d.total} · ${d.chapter}`;$('notes').textContent=d.notes;$('nextTitle').textContent=`Después: ${d.next}`;$('build').textContent=`Guía ${Math.floor(d.start/60)}:${String(d.start%60).padStart(2,'0')}–${Math.floor((d.start+d.seconds)/60)}:${String((d.start+d.seconds)%60).padStart(2,'0')} · ${d.seconds/60} min`+(d.builds?` · Etapa ${d.step} de ${d.builds}`:'')});if(window.opener)window.opener.postMessage({type:'presenter-ready'},location.origin==='null'?'*':location.origin);$('prev').onclick=()=>send('prev');$('next').onclick=()=>send('next');$('blackout').onclick=()=>send('blackout');addEventListener('keydown',e=>{if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();send('next')}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();send('prev')}});let running=false,elapsed=0,started=0;function timer(){let t=elapsed+(running?Date.now()-started:0);let s=Math.floor(t/1000);$('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};$('timerToggle').onclick=()=>{if(running)elapsed+=Date.now()-started;else started=Date.now();running=!running;$('timerToggle').textContent=running?'Pausar':'Continuar';timer()};$('timerReset').onclick=()=>{elapsed=0;started=Date.now();timer()};setInterval(timer,1000);
</script></body></html>
