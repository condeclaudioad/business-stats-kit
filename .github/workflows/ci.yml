name: Verify starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_MODE: demo
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kit_test
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: kit_auth_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U kit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated import database
        run: node -e "const c=new (require('pg').Client)({connectionString:'postgresql://kit_test:ci_disposable_only@localhost:5432/kit_auth_test'});c.connect().then(()=>c.query('CREATE DATABASE kit_import_test')).then(()=>c.end()).catch(e=>{console.error(e.message);process.exit(1)})"
      - run: npm test
        env:
          AUTH_TEST_DATABASE_URL: postgresql://kit_test:ci_disposable_only@localhost:5432/kit_auth_test
          TEST_DATABASE_URL: postgresql://kit_test:ci_disposable_only@localhost:5432/kit_import_test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Prepare isolated browser database
        run: node -e "const c=new (require('pg').Client)({connectionString:'postgresql://kit_test:ci_disposable_only@localhost:5432/kit_auth_test'});c.connect().then(()=>c.query('CREATE DATABASE kit_e2e_test')).then(()=>c.end()).catch(()=>process.exit(1))"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          E2E_DATABASE_URL: postgresql://kit_test:ci_disposable_only@localhost:5432/kit_e2e_test
